spring:
  application:
    name: my-app

  # ---- Datasource (MySQL) ----
  # Credentials come from environment variables so no secret is committed. The defaults are for local dev only.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:baito}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- JPA / Hibernate ----
  jpa:
    # Use 'validate' (or Flyway/Liquibase migrations) in production; 'update' is a dev convenience.
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ---- Redis (auth-token store) ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ---- Auth (opaque bearer token) ----
# On login an opaque token is issued and the principal is stored, AES-GCM encrypted, in Redis under
# that token. Clients send it as `Authorization: Bearer <token>`.
app:
  auth:
    token:
      # Base64-encoded 256-bit AES key. Override in every non-local environment. The default is a
      # throwaway dev key ("0123456789abcdef0123456789abcdef").
      secret: ${AUTH_TOKEN_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      ttl: ${AUTH_TOKEN_TTL:30m}